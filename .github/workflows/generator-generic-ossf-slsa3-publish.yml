# Generate release provenance using the maintained SLSA generator.
# The generator project recommends GitHub artifact attestations for new
# projects, but this workflow preserves the existing release-provenance path.

name: SLSA generic generator

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      digests: ${{ steps.hash.outputs.hashes }}

    steps:
      - uses: actions/checkout@v4

      - name: Build artifacts
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix=danny-ai-os/ "${GITHUB_SHA}" > danny-ai-os-source.tar.gz

      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail
          echo "hashes=$(sha256sum danny-ai-os-source.tar.gz | base64 -w0)" >> "${GITHUB_OUTPUT}"

      - name: Attach source archive to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" danny-ai-os-source.tar.gz --clobber

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true
