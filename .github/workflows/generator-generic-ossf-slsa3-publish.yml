# Generate signed build provenance with GitHub artifact attestations.
# The upstream SLSA GitHub Generator is no longer actively maintained.

name: Build provenance attestation

on:
  workflow_dispatch:
  pull_request:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4

      - name: Build artifacts
        run: |
          set -euo pipefail
          echo "artifact1" > artifact1
          echo "artifact2" > artifact2

      # Do not create attestations from untrusted pull-request runs.
      - name: Generate artifact attestation
        id: attest
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: 'artifact*'

      - name: Preserve attestation bundle as workflow artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: provenance-attestation
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 5

  upload-release-attestation:
    needs: [build]
    if: github.event_name == 'release' && github.event.action == 'created'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download attestation bundle
        uses: actions/download-artifact@v4
        with:
          name: provenance-attestation
          path: attestation

      - name: Upload attestation bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" attestation/* --clobber
